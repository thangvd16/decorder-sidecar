name: Build FFmpeg Windows Sidecar

on:
  workflow_dispatch:
    inputs:
      ffmpeg_archive_url:
        description: "URL FFmpeg Windows LGPL archive"
        required: false
        default: "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl.zip"
      ffmpeg_archive_sha256:
        description: "Optional SHA-256. If empty, workflow reads checksums.sha256 from the latest BtbN release."
        required: false
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  BINARY_BASENAME: ffmpeg
  FFMPEG_ARCHIVE_URL: ${{ github.event.inputs.ffmpeg_archive_url || 'https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl.zip' }}
  FFMPEG_CHECKSUMS_URL: https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/checksums.sha256
  FFMPEG_EXPECTED_SHA256: ${{ github.event.inputs.ffmpeg_archive_sha256 || '' }}
  TARGET_TRIPLE: x86_64-pc-windows-msvc

jobs:
  build-ffmpeg-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Download FFmpeg archive
        shell: pwsh
        run: |
          $archiveName = Split-Path -Leaf ([System.Uri]"${env:FFMPEG_ARCHIVE_URL}").AbsolutePath
          if ([string]::IsNullOrWhiteSpace($archiveName)) {
            throw "Cannot resolve archive name from FFMPEG_ARCHIVE_URL"
          }

          echo "FFMPEG_ARCHIVE_NAME=$archiveName" >> $env:GITHUB_ENV
          Write-Host "Downloading ${env:FFMPEG_ARCHIVE_URL}"
          Invoke-WebRequest -Uri "${env:FFMPEG_ARCHIVE_URL}" -OutFile $archiveName

      - name: Verify FFmpeg archive checksum
        shell: pwsh
        run: |
          $archiveName = "${env:FFMPEG_ARCHIVE_NAME}"
          $expected = "${env:FFMPEG_EXPECTED_SHA256}".Trim().ToLowerInvariant()
          if ([string]::IsNullOrWhiteSpace($expected)) {
            Invoke-WebRequest -Uri "${env:FFMPEG_CHECKSUMS_URL}" -OutFile "checksums.sha256"
            $line = Get-Content "checksums.sha256" | Where-Object { $_.Trim().EndsWith($archiveName) -or $_.Trim().EndsWith("*$archiveName") } | Select-Object -First 1
            if (!$line) {
              throw "Cannot find checksum for '$archiveName'. Set workflow_dispatch input ffmpeg_archive_sha256."
            }
            $expected = (($line -split '\s+')[0]).ToLowerInvariant()
          }

          $actual = (Get-FileHash $archiveName -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "Expected SHA-256: $expected"
          Write-Host "Actual SHA-256:   $actual"
          if ($actual -ne $expected) {
            throw "FFmpeg archive checksum mismatch"
          }

          echo "FFMPEG_ARCHIVE_SHA256=$actual" >> $env:GITHUB_ENV

      - name: Package FFmpeg sidecar
        shell: pwsh
        run: |
          $archiveName = "${env:FFMPEG_ARCHIVE_NAME}"
          Expand-Archive -Path $archiveName -DestinationPath "ffmpeg-package" -Force

          $ffmpegExe = Get-ChildItem "ffmpeg-package" -Recurse -Filter "ffmpeg.exe" | Where-Object { $_.FullName -match "\\bin\\" } | Select-Object -First 1
          if (!$ffmpegExe) {
            throw "ffmpeg.exe was not found in archive '$archiveName'"
          }

          New-Item -ItemType Directory -Force -Path "dist" | Out-Null
          $target = "dist\${env:BINARY_BASENAME}-${env:TARGET_TRIPLE}.exe"
          Copy-Item $ffmpegExe.FullName $target -Force

          @(
            "FFmpeg Windows sidecar source",
            "Archive URL: ${env:FFMPEG_ARCHIVE_URL}",
            "Archive SHA-256: ${env:FFMPEG_ARCHIVE_SHA256}",
            "Package variant: Windows x64 LGPL",
            "Provider: BtbN/FFmpeg-Builds, linked from https://ffmpeg.org/download.html",
            "Legal notes: https://www.ffmpeg.org/legal.html"
          ) | Set-Content -Path "dist\FFMPEG_SOURCE.txt" -Encoding utf8

          echo "FFMPEG_BINARY=$target" >> $env:GITHUB_ENV
          Get-ChildItem dist | Select-Object Name, Length | Format-Table | Out-String | Write-Host

      - name: Smoke test FFmpeg
        shell: pwsh
        run: |
          & "${env:FFMPEG_BINARY}" -hide_banner -version
          if ($LASTEXITCODE -ne 0) {
            throw "ffmpeg -version failed"
          }

          & "${env:FFMPEG_BINARY}" -hide_banner -f lavfi -i testsrc2=duration=1:size=160x120:rate=5 -frames:v 1 -f null NUL
          if ($LASTEXITCODE -ne 0) {
            throw "ffmpeg lavfi smoke test failed"
          }

      - name: Upload FFmpeg artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-${{ env.TARGET_TRIPLE }}
          path: dist/
          if-no-files-found: error

      - name: Publish GitHub Release asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
