name: Build ZBar Decoder Sidecar

on:
  workflow_dispatch:
    inputs:
      cmake_source_dir:
        description: "Folder chứa CMakeLists.txt, ví dụ: . hoặc native/decoder"
        required: false
        default: "."
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  BINARY_BASENAME: pack-audit-decoder
  CMAKE_SOURCE_DIR: ${{ github.event.inputs.cmake_source_dir || '.' }}
  CMAKE_TARGET: pack-audit-decoder
  SMOKE_TEST_ARGS: --decode-image fixtures/sample.pgm

jobs:
  build-windows-msvc:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      CMAKE_BUILD_DIR: build/windows-msvc
      TARGET_TRIPLE: x86_64-pc-windows-msvc
      VCPKG_TARGET_TRIPLET: x64-windows-static

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup vcpkg cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/vcpkg_installed
            ${{ github.workspace }}/build/windows-msvc/vcpkg_installed
            ~\AppData\Local\vcpkg\archives
          key: zbar-vcpkg-${{ runner.os }}-${{ hashFiles('**/vcpkg.json', '**/vcpkg-configuration.json') }}
          restore-keys: |
            zbar-vcpkg-${{ runner.os }}-

      - name: Resolve CMake source dir
        shell: pwsh
        run: |
          $sourceDir = "${env:CMAKE_SOURCE_DIR}"
          if ([string]::IsNullOrWhiteSpace($sourceDir)) {
            $sourceDir = "."
          }

          $candidate = Resolve-Path -Path $sourceDir -ErrorAction SilentlyContinue
          if ($candidate -and (Test-Path (Join-Path $candidate.Path "CMakeLists.txt"))) {
            echo "CMAKE_SOURCE_DIR=$($candidate.Path)" >> $env:GITHUB_ENV
            Write-Host "Using CMake source dir: $($candidate.Path)"
            exit 0
          }

          throw "CMakeLists.txt was not found in '$sourceDir'. Set workflow_dispatch input 'cmake_source_dir' to the decoder source folder."

      - name: Resolve vcpkg root
        shell: pwsh
        run: |
          $vcpkgRoot = $env:VCPKG_INSTALLATION_ROOT
          $toolchain = ""
          if ([string]::IsNullOrWhiteSpace($vcpkgRoot) -or !(Test-Path $vcpkgRoot)) {
            if (Test-Path "C:\vcpkg") {
              $vcpkgRoot = "C:\vcpkg"
            }
          }

          if (![string]::IsNullOrWhiteSpace($vcpkgRoot) -and (Test-Path $vcpkgRoot)) {
            $candidateToolchain = Join-Path $vcpkgRoot "scripts\buildsystems\vcpkg.cmake"
            if (Test-Path $candidateToolchain) {
              $toolchain = $candidateToolchain
            }
          }

          if ([string]::IsNullOrWhiteSpace($toolchain)) {
            $vcpkgRoot = Join-Path $env:RUNNER_TEMP "vcpkg"
            if (!(Test-Path $vcpkgRoot)) {
              git clone https://github.com/microsoft/vcpkg.git $vcpkgRoot
            }
            & "$vcpkgRoot\bootstrap-vcpkg.bat" -disableMetrics
            $toolchain = Join-Path $vcpkgRoot "scripts\buildsystems\vcpkg.cmake"
          }

          if (!(Test-Path $toolchain)) {
            throw "vcpkg toolchain not found: $toolchain"
          }

          echo "VCPKG_ROOT=$vcpkgRoot" >> $env:GITHUB_ENV
          echo "VCPKG_TOOLCHAIN=$toolchain" >> $env:GITHUB_ENV

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake `
            -S "${env:CMAKE_SOURCE_DIR}" `
            -B "${env:CMAKE_BUILD_DIR}" `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DVCPKG_TARGET_TRIPLET="${env:VCPKG_TARGET_TRIPLET}" `
            -DCMAKE_TOOLCHAIN_FILE="${env:VCPKG_TOOLCHAIN}"

      - name: Build decoder
        shell: pwsh
        run: |
          cmake --build "${env:CMAKE_BUILD_DIR}" --config Release --target "${env:CMAKE_TARGET}" --parallel

      - name: Package sidecar binary
        shell: pwsh
        run: |
          $source = Join-Path "${env:CMAKE_BUILD_DIR}" "Release\${env:BINARY_BASENAME}.exe"
          if (!(Test-Path $source)) {
            throw "Decoder binary not found: $source"
          }

          New-Item -ItemType Directory -Force -Path "dist" | Out-Null
          $target = "dist\${env:BINARY_BASENAME}-${env:TARGET_TRIPLE}.exe"
          Copy-Item $source $target -Force
          echo "DECODER_BINARY=$target" >> $env:GITHUB_ENV

      - name: Smoke test decoder
        shell: pwsh
        run: |
          $args = "${env:SMOKE_TEST_ARGS}".Split(" ", [System.StringSplitOptions]::RemoveEmptyEntries)
          Push-Location "${env:CMAKE_SOURCE_DIR}"
          try {
            & "${env:GITHUB_WORKSPACE}\${env:DECODER_BINARY}" @args
            if ($LASTEXITCODE -ne 0) {
              throw "Decoder smoke test failed with exit code $LASTEXITCODE"
            }
          } finally {
            Pop-Location
          }

      - name: Upload decoder artifact
        uses: actions/upload-artifact@v4
        with:
          name: pack-audit-decoder-${{ env.TARGET_TRIPLE }}
          path: dist/pack-audit-decoder-${{ env.TARGET_TRIPLE }}.exe
          if-no-files-found: error

      - name: Publish GitHub Release asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/pack-audit-decoder-${{ env.TARGET_TRIPLE }}.exe

  build-macos:
    runs-on: macos-latest
    timeout-minutes: 40
    env:
      CMAKE_BUILD_DIR: build/macos

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup vcpkg cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/vcpkg_installed
            ${{ github.workspace }}/build/macos/vcpkg_installed
            ~/.cache/vcpkg/archives
          key: zbar-vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/vcpkg.json', '**/vcpkg-configuration.json') }}
          restore-keys: |
            zbar-vcpkg-${{ runner.os }}-${{ runner.arch }}-
            zbar-vcpkg-${{ runner.os }}-

      - name: Resolve target triples
        shell: bash
        run: |
          arch="$(uname -m)"
          if [ "$arch" = "arm64" ]; then
            echo "TARGET_TRIPLE=aarch64-apple-darwin" >> "$GITHUB_ENV"
            echo "VCPKG_TARGET_TRIPLET=arm64-osx" >> "$GITHUB_ENV"
          else
            echo "TARGET_TRIPLE=x86_64-apple-darwin" >> "$GITHUB_ENV"
            echo "VCPKG_TARGET_TRIPLET=x64-osx" >> "$GITHUB_ENV"
          fi

      - name: Resolve CMake source dir
        shell: bash
        run: |
          source_dir="${CMAKE_SOURCE_DIR:-.}"
          if [ -f "$source_dir/CMakeLists.txt" ]; then
            echo "CMAKE_SOURCE_DIR=$(cd "$source_dir" && pwd)" >> "$GITHUB_ENV"
            exit 0
          fi

          echo "CMakeLists.txt was not found in '$source_dir'. Set workflow_dispatch input 'cmake_source_dir' to the decoder source folder." >&2
          exit 1

      - name: Resolve vcpkg root
        shell: bash
        run: |
          vcpkg_root="${VCPKG_INSTALLATION_ROOT:-}"
          toolchain=""
          if [ -z "$vcpkg_root" ] || [ ! -d "$vcpkg_root" ]; then
            if command -v vcpkg >/dev/null 2>&1; then
              vcpkg_bin="$(command -v vcpkg)"
              vcpkg_root="$(cd "$(dirname "$vcpkg_bin")/.." && pwd)"
            fi
          fi

          if [ -n "$vcpkg_root" ] && [ -d "$vcpkg_root" ] && [ -f "$vcpkg_root/scripts/buildsystems/vcpkg.cmake" ]; then
            toolchain="$vcpkg_root/scripts/buildsystems/vcpkg.cmake"
          fi

          if [ -z "$toolchain" ]; then
            vcpkg_root="$RUNNER_TEMP/vcpkg"
            if [ ! -d "$vcpkg_root" ]; then
              git clone https://github.com/microsoft/vcpkg.git "$vcpkg_root"
            fi
            "$vcpkg_root/bootstrap-vcpkg.sh" -disableMetrics
            toolchain="$vcpkg_root/scripts/buildsystems/vcpkg.cmake"
          fi

          if [ ! -f "$toolchain" ]; then
            echo "vcpkg toolchain not found: $toolchain" >&2
            exit 1
          fi

          echo "VCPKG_ROOT=$vcpkg_root" >> "$GITHUB_ENV"
          echo "VCPKG_TOOLCHAIN=$toolchain" >> "$GITHUB_ENV"

      - name: Configure CMake
        shell: bash
        run: |
          cmake \
            -S "$CMAKE_SOURCE_DIR" \
            -B "$CMAKE_BUILD_DIR" \
            -DCMAKE_BUILD_TYPE=Release \
            -DVCPKG_TARGET_TRIPLET="$VCPKG_TARGET_TRIPLET" \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_TOOLCHAIN"

      - name: Build decoder
        shell: bash
        run: |
          cmake --build "$CMAKE_BUILD_DIR" --config Release --target "$CMAKE_TARGET" --parallel

      - name: Package sidecar binary
        shell: bash
        run: |
          source="$CMAKE_BUILD_DIR/$BINARY_BASENAME"
          if [ ! -f "$source" ]; then
            source="$(find "$CMAKE_BUILD_DIR" -type f -name "$BINARY_BASENAME" -perm -111 | head -n 1)"
          fi

          if [ -z "$source" ] || [ ! -f "$source" ]; then
            echo "Decoder binary not found" >&2
            exit 1
          fi

          mkdir -p dist
          target="dist/$BINARY_BASENAME-$TARGET_TRIPLE"
          cp "$source" "$target"
          chmod +x "$target"
          echo "DECODER_BINARY=$target" >> "$GITHUB_ENV"

      - name: Smoke test decoder
        shell: bash
        run: |
          pushd "$CMAKE_SOURCE_DIR"
          "$GITHUB_WORKSPACE/$DECODER_BINARY" --decode-image fixtures/sample.pgm
          popd

      - name: Upload decoder artifact
        uses: actions/upload-artifact@v4
        with:
          name: pack-audit-decoder-${{ env.TARGET_TRIPLE }}
          path: dist/pack-audit-decoder-${{ env.TARGET_TRIPLE }}
          if-no-files-found: error

      - name: Publish GitHub Release asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/pack-audit-decoder-${{ env.TARGET_TRIPLE }}
