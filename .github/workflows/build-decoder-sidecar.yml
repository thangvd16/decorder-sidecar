name: Build Decoder Sidecar

on:
  workflow_dispatch:
    inputs:
      cmake_source_dir:
        description: "Folder chứa CMakeLists.txt, ví dụ: . hoặc native/decoder"
        required: false
        default: "."
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  BINARY_BASENAME: pack-audit-decoder
  WINDOWS_TARGET_TRIPLE: x86_64-pc-windows-msvc
  CMAKE_SOURCE_DIR: ${{ github.event.inputs.cmake_source_dir || '.' }}
  CMAKE_BUILD_DIR: build/windows-msvc
  CMAKE_TARGET: pack-audit-decoder
  VCPKG_TARGET_TRIPLET: x64-windows-static
  SMOKE_TEST_ARGS: --decode-image fixtures/sample.pgm

jobs:
  build-windows-msvc:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup vcpkg cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/vcpkg_installed
            ${{ github.workspace }}/build/windows-msvc/vcpkg_installed
            ~\AppData\Local\vcpkg\archives
          key: vcpkg-${{ runner.os }}-${{ hashFiles('**/vcpkg.json', '**/vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      - name: Resolve CMake source dir
        shell: pwsh
        run: |
          $sourceDir = "${env:CMAKE_SOURCE_DIR}"
          if ([string]::IsNullOrWhiteSpace($sourceDir)) {
            $sourceDir = "."
          }

          $candidate = Resolve-Path -Path $sourceDir -ErrorAction SilentlyContinue
          if ($candidate -and (Test-Path (Join-Path $candidate.Path "CMakeLists.txt"))) {
            echo "CMAKE_SOURCE_DIR=$($candidate.Path)" >> $env:GITHUB_ENV
            Write-Host "Using CMake source dir: $($candidate.Path)"
            exit 0
          }

          Write-Host "CMakeLists.txt was not found in '$sourceDir'. Searching repository..."
          $matches = @(Get-ChildItem -Path $env:GITHUB_WORKSPACE -Filter CMakeLists.txt -Recurse -File |
            Where-Object { $_.FullName -notmatch '[\\/](\.git|build|vcpkg_installed)[\\/]' })

          if ($matches.Count -eq 0) {
            throw "No CMakeLists.txt found. Set workflow_dispatch input 'cmake_source_dir' to the decoder source folder."
          }

          if ($matches.Count -gt 1) {
            $paths = ($matches | ForEach-Object { $_.DirectoryName }) -join "`n"
            throw "Multiple CMakeLists.txt files found. Set workflow_dispatch input 'cmake_source_dir' explicitly. Candidates:`n$paths"
          }

          $resolved = $matches[0].DirectoryName
          echo "CMAKE_SOURCE_DIR=$resolved" >> $env:GITHUB_ENV
          Write-Host "Using discovered CMake source dir: $resolved"

      - name: Configure CMake
        shell: pwsh
        run: |
          $vcpkgRoot = $env:VCPKG_INSTALLATION_ROOT
          if ([string]::IsNullOrWhiteSpace($vcpkgRoot) -or !(Test-Path $vcpkgRoot)) {
            if (Test-Path "C:\vcpkg") {
              $vcpkgRoot = "C:\vcpkg"
            } else {
              $vcpkgCommand = Get-Command vcpkg -ErrorAction SilentlyContinue
              if ($vcpkgCommand) {
                $vcpkgRoot = Split-Path -Parent $vcpkgCommand.Source
              }
            }
          }

          if ([string]::IsNullOrWhiteSpace($vcpkgRoot) -or !(Test-Path $vcpkgRoot)) {
            throw "Cannot resolve vcpkg root. Expected VCPKG_INSTALLATION_ROOT, C:\vcpkg, or vcpkg in PATH."
          }

          $toolchain = Join-Path $vcpkgRoot "scripts\buildsystems\vcpkg.cmake"
          if (!(Test-Path $toolchain)) {
            throw "vcpkg toolchain not found: $toolchain"
          }

          cmake `
            -S "${env:CMAKE_SOURCE_DIR}" `
            -B "${env:CMAKE_BUILD_DIR}" `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DVCPKG_TARGET_TRIPLET="${env:VCPKG_TARGET_TRIPLET}" `
            -DCMAKE_TOOLCHAIN_FILE="$toolchain"

      - name: Build decoder
        shell: pwsh
        run: |
          cmake --build "${env:CMAKE_BUILD_DIR}" --config Release --target "${env:CMAKE_TARGET}" --parallel

      - name: Package sidecar binary
        shell: pwsh
        run: |
          $source = Join-Path "${env:CMAKE_BUILD_DIR}" "Release\${env:BINARY_BASENAME}.exe"
          if (!(Test-Path $source)) {
            throw "Decoder binary not found: $source"
          }

          New-Item -ItemType Directory -Force -Path "dist" | Out-Null
          $target = "dist\${env:BINARY_BASENAME}-${env:WINDOWS_TARGET_TRIPLE}.exe"
          Copy-Item $source $target -Force
          echo "DECODER_BINARY=$target" >> $env:GITHUB_ENV

      - name: Smoke test decoder
        shell: pwsh
        run: |
          if (!(Test-Path "${env:DECODER_BINARY}")) {
            throw "Packaged decoder binary not found: ${env:DECODER_BINARY}"
          }

          $args = "${env:SMOKE_TEST_ARGS}".Split(" ", [System.StringSplitOptions]::RemoveEmptyEntries)
          Push-Location "${env:CMAKE_SOURCE_DIR}"
          try {
            & "${env:GITHUB_WORKSPACE}\${env:DECODER_BINARY}" @args
            if ($LASTEXITCODE -ne 0) {
              throw "Decoder smoke test failed with exit code $LASTEXITCODE"
            }
          } finally {
            Pop-Location
          }

      - name: Upload decoder artifact
        uses: actions/upload-artifact@v4
        with:
          name: pack-audit-decoder-${{ env.WINDOWS_TARGET_TRIPLE }}
          path: dist/pack-audit-decoder-${{ env.WINDOWS_TARGET_TRIPLE }}.exe
          if-no-files-found: error

      - name: Publish GitHub Release asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/pack-audit-decoder-${{ env.WINDOWS_TARGET_TRIPLE }}.exe
